# Quality gate thresholds — sourced as bash by quality/grade.sh.
# Copy to <project-root>/quality/thresholds.conf to override per project;
# `cli quality` / `cli ship` prefer that path and fall back to this default.
#
# The scoring model: start at 10.0, deduct per violation, map to a letter
# grade. HARD_MAX_CCN is a blocker independent of the score — one function
# that complex fails the gate no matter how clean everything else is.

# Cyclomatic complexity per function.
MAX_CCN=10
HARD_MAX_CCN=20

# Function length (lines) and parameter count.
MAX_FUNC_LENGTH=80
MAX_PARAMS=6

# Cross-file duplication, as a percentage of duplicated lines (jscpd).
MAX_DUPLICATION_PCT=5

# Gate threshold. 10=A, 9=A/B boundary, 8=B, 7=C, 6=D, below=F.
MIN_PASSING_SCORE=7.0

# Score deducted per violation of each kind.
DEDUCT_PER_CCN_VIOLATION=0.3
DEDUCT_PER_LENGTH_VIOLATION=0.2
DEDUCT_PER_PARAM_VIOLATION=0.1
